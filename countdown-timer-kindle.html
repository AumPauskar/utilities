<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer - Kindle Edition</title>
    <style type="text/css">
        /* CSS 2.1 ONLY - No flexbox, no grid, no CSS variables, no calc */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 10px;
            font-size: 16px;
            line-height: 1.4;
        }
        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }
        .top-banner {
            border-bottom: 3px solid #000000;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .top-banner h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: -1px;
        }
        .top-banner p {
            margin: 4px 0 0 0;
            font-size: 13px;
        }
        /* Navigation tabs */
        .tab-bar {
            border-bottom: 2px solid #000000;
            margin-bottom: 16px;
            padding-bottom: 6px;
        }
        .tab-btn {
            display: inline-block;
            padding: 8px 14px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            margin-right: 6px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #000000;
            color: #ffffff;
        }
        /* Clock / Digit Display Box */
        .time-box {
            border: 4px solid #000000;
            padding: 20px 10px;
            text-align: center;
            background-color: #ffffff;
            margin-bottom: 15px;
        }
        .big-time {
            font-family: "Courier New", Courier, monospace;
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
        }
        .status-badge {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        /* Progress bar */
        .prog-track {
            border: 3px solid #000000;
            height: 22px;
            width: 90%;
            margin: 14px auto 6px auto;
            background-color: #ffffff;
        }
        .prog-fill {
            background-color: #000000;
            height: 22px;
            width: 100%;
        }
        /* Control Buttons */
        .controls-row {
            text-align: center;
            margin: 15px 0;
        }
        .action-btn {
            display: inline-block;
            padding: 12px 22px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            margin: 4px;
            cursor: pointer;
        }
        .action-btn.btn-dark {
            background-color: #000000;
            color: #ffffff;
        }
        .action-btn:disabled {
            color: #888888;
            border-color: #888888;
            cursor: default;
        }
        /* Preset buttons */
        .preset-btn {
            display: inline-block;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            margin: 3px;
            cursor: pointer;
        }
        .preset-btn.active {
            background-color: #000000;
            color: #ffffff;
        }
        /* Card sections */
        .card {
            border: 2px solid #000000;
            padding: 12px;
            margin-bottom: 16px;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            border-bottom: 1px solid #000000;
            padding-bottom: 4px;
        }
        /* Alert Box */
        .alert-box {
            background-color: #000000;
            color: #ffffff;
            border: 4px solid #000000;
            padding: 16px;
            text-align: center;
            margin: 15px 0;
        }
        .alert-box h2 {
            margin: 0 0 6px 0;
            font-size: 26px;
            color: #ffffff;
        }
        /* Footer */
        .foot {
            margin-top: 25px;
            padding-top: 10px;
            border-top: 2px solid #000000;
            font-size: 12px;
        }
        .foot a {
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="wrap">
    <div class="top-banner">
        <h1>Countdown Timer</h1>
        <p>Kindle &amp; E-Ink Edition &middot; 1s Ticks &middot; No Flashing</p>
    </div>

    <!-- Navigation -->
    <div class="tab-bar">
        <a class="tab-btn" href="kindle.html">Kindle Home</a>
        <a class="tab-btn" href="stopwatch-kindle.html">Stopwatch</a>
        <a class="tab-btn active" href="countdown-timer-kindle.html">Countdown Timer</a>
        <a class="tab-btn" href="countdown-timer.html" style="float: right;">Full Site &rarr;</a>
        <div style="clear: both;"></div>
    </div>

    <!-- TIMER DISPLAY -->
    <div>
        <div class="time-box">
            <div id="tmDigits" class="big-time">25:00</div>
            <div id="tmStatus" class="status-badge">[ READY ]</div>

            <div class="prog-track">
                <div id="tmProgBar" class="prog-fill"></div>
            </div>
            <div id="tmPercent" style="font-size: 13px; font-weight: bold; margin-top: 4px;">100% remaining</div>
        </div>

        <div class="controls-row">
            <button id="tmBtnStart" class="action-btn btn-dark" type="button" onclick="tmToggle()">Start</button>
            <button id="tmBtnReset" class="action-btn" type="button" onclick="tmReset()" disabled>Reset</button>
            <button class="action-btn" type="button" onclick="tmAddMinutes(1)">+1m</button>
            <button class="action-btn" type="button" onclick="tmAddMinutes(5)">+5m</button>
        </div>

        <!-- Alert Banner on Completion -->
        <div id="tmAlertBox" class="alert-box" style="display: none;">
            <h2>*** TIME'S UP! ***</h2>
            <p style="margin: 6px 0 14px 0;">Your countdown has completed.</p>
            <button class="action-btn" type="button" style="background-color:#ffffff; color:#000000;" onclick="tmDismissAlert()">[ Dismiss ]</button>
        </div>

        <!-- Presets -->
        <div class="card">
            <h3>PRESETS</h3>
            <div>
                <button class="preset-btn active" type="button" onclick="tmSetMinutes(25, this)">25m Pomodoro</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(5, this)">5m Break</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(15, this)">15m Long Break</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(1, this)">1m</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(3, this)">3m</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(10, this)">10m</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(30, this)">30m</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(45, this)">45m</button>
                <button class="preset-btn" type="button" onclick="tmSetMinutes(60, this)">60m</button>
            </div>
        </div>

        <!-- Custom Duration Form -->
        <div class="card">
            <h3>CUSTOM TIME</h3>
            <div style="margin-top: 6px;">
                <label style="font-weight: bold; margin-right: 10px;">
                    Minutes:
                    <input type="number" id="tmInputMin" value="25" min="0" max="999" style="width: 55px; font-size: 16px; padding: 3px; border: 2px solid #000000;">
                </label>
                <label style="font-weight: bold; margin-right: 10px;">
                    Seconds:
                    <input type="number" id="tmInputSec" value="0" min="0" max="59" style="width: 45px; font-size: 16px; padding: 3px; border: 2px solid #000000;">
                </label>
                <button class="preset-btn" type="button" onclick="tmApplyCustom()">Set</button>
            </div>
        </div>
    </div>

    <div class="foot">
        <div style="float: left;">utilities &middot; Kindle Edition</div>
        <div style="float: right;"><a href="countdown-timer.html">Open Modern Version</a></div>
        <div style="clear: both;"></div>
    </div>
</div>

<script type="text/javascript">
function pad2(n) {
    return (n < 10 ? "0" : "") + n;
}

function getNow() {
    return new Date().getTime();
}

function formatMS(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.ceil(ms / 1000);
    var s = totalSec % 60;
    var totalMin = Math.floor(totalSec / 60);
    var m = totalMin % 60;
    var h = Math.floor(totalMin / 60);
    if (h > 0) {
        return pad2(h) + ":" + pad2(m) + ":" + pad2(s);
    }
    return pad2(m) + ":" + pad2(s);
}

var tmDurationMs = 25 * 60 * 1000;
var tmRemainingMs = tmDurationMs;
var tmRunning = false;
var tmEndTime = 0;
var tmTimer = null;

function tmUpdateDisplay(ms) {
    document.getElementById("tmDigits").innerHTML = formatMS(ms);
    var ratio = tmDurationMs > 0 ? (ms / tmDurationMs) : 0;
    if (ratio < 0) ratio = 0;
    if (ratio > 1) ratio = 1;
    var pct = Math.round(ratio * 100);

    document.getElementById("tmProgBar").style.width = pct + "%";
    document.getElementById("tmPercent").innerHTML = pct + "% remaining";
}

function tmToggle() {
    if (tmRunning) {
        tmRunning = false;
        if (tmTimer) clearInterval(tmTimer);
        tmTimer = null;
        tmRemainingMs = tmEndTime - getNow();
        if (tmRemainingMs < 0) tmRemainingMs = 0;

        document.getElementById("tmStatus").innerHTML = "[ PAUSED ]";
        document.getElementById("tmBtnStart").innerHTML = "Resume";
        document.getElementById("tmBtnStart").className = "action-btn btn-dark";
        tmUpdateDisplay(tmRemainingMs);
    } else {
        if (tmRemainingMs <= 0) {
            tmRemainingMs = tmDurationMs;
        }
        tmDismissAlert();
        tmRunning = true;
        tmEndTime = getNow() + tmRemainingMs;

        document.getElementById("tmStatus").innerHTML = "[ RUNNING ]";
        document.getElementById("tmBtnStart").innerHTML = "Pause";
        document.getElementById("tmBtnStart").className = "action-btn";
        document.getElementById("tmBtnReset").disabled = false;

        tmTimer = setInterval(function() {
            var now = getNow();
            tmRemainingMs = tmEndTime - now;
            if (tmRemainingMs <= 0) {
                tmRemainingMs = 0;
                tmComplete();
            } else {
                tmUpdateDisplay(tmRemainingMs);
            }
        }, 1000);
        tmUpdateDisplay(tmRemainingMs);
    }
}

function tmReset() {
    tmRunning = false;
    if (tmTimer) clearInterval(tmTimer);
    tmTimer = null;
    tmDismissAlert();

    tmRemainingMs = tmDurationMs;
    document.getElementById("tmStatus").innerHTML = "[ READY ]";
    document.getElementById("tmBtnStart").innerHTML = "Start";
    document.getElementById("tmBtnStart").className = "action-btn btn-dark";
    document.getElementById("tmBtnReset").disabled = true;
    tmUpdateDisplay(tmRemainingMs);
}

function tmComplete() {
    tmRunning = false;
    if (tmTimer) clearInterval(tmTimer);
    tmTimer = null;

    document.getElementById("tmStatus").innerHTML = "[ TIME'S UP ]";
    document.getElementById("tmBtnStart").innerHTML = "Restart";
    document.getElementById("tmBtnStart").className = "action-btn btn-dark";
    tmUpdateDisplay(0);
    document.getElementById("tmAlertBox").style.display = "block";
}

function tmDismissAlert() {
    document.getElementById("tmAlertBox").style.display = "none";
}

function tmSetMinutes(min, btn) {
    tmRunning = false;
    if (tmTimer) clearInterval(tmTimer);
    tmTimer = null;
    tmDismissAlert();

    tmDurationMs = min * 60 * 1000;
    tmRemainingMs = tmDurationMs;

    document.getElementById("tmInputMin").value = min;
    document.getElementById("tmInputSec").value = 0;

    var btns = document.getElementsByTagName("button");
    for (var i = 0; i < btns.length; i++) {
        if (btns[i].className.indexOf("preset-btn") !== -1) {
            btns[i].className = "preset-btn";
        }
    }
    if (btn) btn.className = "preset-btn active";

    document.getElementById("tmStatus").innerHTML = "[ READY ]";
    document.getElementById("tmBtnStart").innerHTML = "Start";
    document.getElementById("tmBtnStart").className = "action-btn btn-dark";
    document.getElementById("tmBtnReset").disabled = true;
    tmUpdateDisplay(tmRemainingMs);
}

function tmAddMinutes(min) {
    var add = min * 60 * 1000;
    tmDurationMs += add;
    tmRemainingMs += add;
    if (tmRunning) {
        tmEndTime += add;
    }
    tmUpdateDisplay(tmRemainingMs);
}

function tmApplyCustom() {
    var m = parseInt(document.getElementById("tmInputMin").value, 10) || 0;
    var s = parseInt(document.getElementById("tmInputSec").value, 10) || 0;
    var total = (m * 60 + s) * 1000;
    if (total > 0) {
        tmRunning = false;
        if (tmTimer) clearInterval(tmTimer);
        tmTimer = null;
        tmDismissAlert();

        tmDurationMs = total;
        tmRemainingMs = total;

        document.getElementById("tmStatus").innerHTML = "[ READY ]";
        document.getElementById("tmBtnStart").innerHTML = "Start";
        document.getElementById("tmBtnStart").className = "action-btn btn-dark";
        document.getElementById("tmBtnReset").disabled = true;
        tmUpdateDisplay(tmRemainingMs);
    } else {
        alert("Please enter a time greater than 0.");
    }
}

document.onkeydown = function(e) {
    var k = e.keyCode || e.which;
    if (k === 32) { // Space
        tmToggle();
        if (e.preventDefault) e.preventDefault();
        return false;
    }
    if (k === 82 || k === 114) { // R
        tmReset();
    }
};

tmUpdateDisplay(tmRemainingMs);
</script>

</body>
</html>

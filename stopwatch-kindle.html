<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch - Kindle Edition</title>
    <style type="text/css">
        /* CSS 2.1 ONLY - No flexbox, no grid, no CSS variables, no calc */
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 10px;
            font-size: 16px;
            line-height: 1.4;
        }
        .wrap {
            max-width: 600px;
            margin: 0 auto;
        }
        .top-banner {
            border-bottom: 3px solid #000000;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .top-banner h1 {
            margin: 0;
            font-size: 26px;
            letter-spacing: -1px;
        }
        .top-banner p {
            margin: 4px 0 0 0;
            font-size: 13px;
        }
        /* Navigation tabs */
        .tab-bar {
            border-bottom: 2px solid #000000;
            margin-bottom: 16px;
            padding-bottom: 6px;
        }
        .tab-btn {
            display: inline-block;
            padding: 8px 14px;
            font-size: 15px;
            font-weight: bold;
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
            margin-right: 6px;
            margin-bottom: 4px;
            cursor: pointer;
        }
        .tab-btn.active {
            background-color: #000000;
            color: #ffffff;
        }
        /* Clock / Digit Display Box */
        .time-box {
            border: 4px solid #000000;
            padding: 24px 10px;
            text-align: center;
            background-color: #ffffff;
            margin-bottom: 15px;
        }
        .big-time {
            font-family: "Courier New", Courier, monospace;
            font-size: 52px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
        }
        .status-badge {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            margin-top: 6px;
        }
        /* Control Buttons */
        .controls-row {
            text-align: center;
            margin: 15px 0;
        }
        .action-btn {
            display: inline-block;
            padding: 12px 22px;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid #000000;
            background-color: #ffffff;
            color: #000000;
            margin: 4px;
            cursor: pointer;
        }
        .action-btn.btn-dark {
            background-color: #000000;
            color: #ffffff;
        }
        .action-btn:disabled {
            color: #888888;
            border-color: #888888;
            cursor: default;
        }
        /* Card sections */
        .card {
            border: 2px solid #000000;
            padding: 12px;
            margin-bottom: 16px;
        }
        .card h3 {
            margin: 0 0 8px 0;
            font-size: 16px;
            border-bottom: 1px solid #000000;
            padding-bottom: 4px;
        }
        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        .data-table th, .data-table td {
            border: 1px solid #000000;
            padding: 6px 8px;
            text-align: left;
        }
        .data-table th {
            background-color: #000000;
            color: #ffffff;
        }
        /* Footer */
        .foot {
            margin-top: 25px;
            padding-top: 10px;
            border-top: 2px solid #000000;
            font-size: 12px;
        }
        .foot a {
            color: #000000;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="wrap">
    <div class="top-banner">
        <h1>Stopwatch</h1>
        <p>Kindle &amp; E-Ink Edition &middot; 1s Ticks &middot; No Flashing</p>
    </div>

    <!-- Navigation -->
    <div class="tab-bar">
        <a class="tab-btn" href="kindle.html">Kindle Home</a>
        <a class="tab-btn active" href="stopwatch-kindle.html">Stopwatch</a>
        <a class="tab-btn" href="countdown-timer-kindle.html">Countdown Timer</a>
        <a class="tab-btn" href="stopwatch.html" style="float: right;">Full Site &rarr;</a>
        <div style="clear: both;"></div>
    </div>

    <!-- STOPWATCH PANEL -->
    <div>
        <div class="time-box">
            <div id="swDigits" class="big-time">00:00:00</div>
            <div id="swStatus" class="status-badge">[ READY ]</div>
        </div>

        <div class="controls-row">
            <button id="swBtnStart" class="action-btn btn-dark" type="button" onclick="swToggle()">Start</button>
            <button id="swBtnLap" class="action-btn" type="button" onclick="swRecordLap()" disabled>Lap</button>
            <button id="swBtnReset" class="action-btn" type="button" onclick="swReset()" disabled>Reset</button>
        </div>

        <!-- Laps Table -->
        <div class="card">
            <h3>RECORDED LAPS (<span id="swLapCount">0</span>)</h3>
            <div id="swLapEmpty" style="padding: 10px; text-align: center; font-size: 14px;">
                No laps recorded yet. Press <b>Lap</b> while stopwatch is running.
            </div>
            <table id="swLapTable" class="data-table" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 45px;">#</th>
                        <th>Lap Split</th>
                        <th>Total Time</th>
                    </tr>
                </thead>
                <tbody id="swLapBody"></tbody>
            </table>
            <div style="margin-top: 8px; text-align: right;">
                <button id="swBtnClear" class="action-btn" style="padding: 6px 12px; font-size: 13px;" type="button" onclick="swClearLaps()" disabled>Clear Laps</button>
            </div>
        </div>
    </div>

    <div class="foot">
        <div style="float: left;">utilities &middot; Kindle Edition</div>
        <div style="float: right;"><a href="stopwatch.html">Open Modern Version</a></div>
        <div style="clear: both;"></div>
    </div>
</div>

<script type="text/javascript">
function pad2(n) {
    return (n < 10 ? "0" : "") + n;
}

function getNow() {
    return new Date().getTime();
}

function formatHMS(ms) {
    if (ms < 0) ms = 0;
    var totalSec = Math.floor(ms / 1000);
    var s = totalSec % 60;
    var totalMin = Math.floor(totalSec / 60);
    var m = totalMin % 60;
    var h = Math.floor(totalMin / 60);
    return pad2(h) + ":" + pad2(m) + ":" + pad2(s);
}

var swRunning = false;
var swStartTime = 0;
var swElapsed = 0;
var swLastLap = 0;
var swTimer = null;
var swLaps = [];

function swUpdateDisplay() {
    var cur = swElapsed;
    if (swRunning) {
        cur += (getNow() - swStartTime);
    }
    document.getElementById("swDigits").innerHTML = formatHMS(cur);
}

function swToggle() {
    if (swRunning) {
        swRunning = false;
        swElapsed += (getNow() - swStartTime);
        if (swTimer) clearInterval(swTimer);
        swTimer = null;

        document.getElementById("swStatus").innerHTML = "[ PAUSED ]";
        document.getElementById("swBtnStart").innerHTML = "Resume";
        document.getElementById("swBtnStart").className = "action-btn btn-dark";
        document.getElementById("swBtnLap").disabled = true;
        swUpdateDisplay();
    } else {
        swRunning = true;
        swStartTime = getNow();
        document.getElementById("swStatus").innerHTML = "[ RUNNING ]";
        document.getElementById("swBtnStart").innerHTML = "Pause";
        document.getElementById("swBtnStart").className = "action-btn";
        document.getElementById("swBtnLap").disabled = false;
        document.getElementById("swBtnReset").disabled = false;

        swTimer = setInterval(function() {
            swUpdateDisplay();
        }, 1000);
        swUpdateDisplay();
    }
}

function swReset() {
    swRunning = false;
    if (swTimer) clearInterval(swTimer);
    swTimer = null;
    swStartTime = 0;
    swElapsed = 0;
    swLastLap = 0;

    document.getElementById("swStatus").innerHTML = "[ READY ]";
    document.getElementById("swBtnStart").innerHTML = "Start";
    document.getElementById("swBtnStart").className = "action-btn btn-dark";
    document.getElementById("swBtnLap").disabled = true;
    document.getElementById("swBtnReset").disabled = true;
    swUpdateDisplay();
    swClearLaps();
}

function swRecordLap() {
    if (!swRunning) return;
    var cur = swElapsed + (getNow() - swStartTime);
    var lapSplit = cur - swLastLap;
    swLastLap = cur;

    swLaps.unshift({
        num: swLaps.length + 1,
        split: lapSplit,
        total: cur
    });

    swRenderLaps();
}

function swRenderLaps() {
    var countElem = document.getElementById("swLapCount");
    var emptyElem = document.getElementById("swLapEmpty");
    var tableElem = document.getElementById("swLapTable");
    var bodyElem = document.getElementById("swLapBody");
    var clearBtn = document.getElementById("swBtnClear");

    countElem.innerHTML = swLaps.length;

    if (swLaps.length === 0) {
        emptyElem.style.display = "block";
        tableElem.style.display = "none";
        clearBtn.disabled = true;
        bodyElem.innerHTML = "";
        return;
    }

    emptyElem.style.display = "none";
    tableElem.style.display = "table";
    clearBtn.disabled = false;

    var rows = "";
    for (var i = 0; i < swLaps.length; i++) {
        var item = swLaps[i];
        rows += "<tr>";
        rows += "<td>#" + item.num + "</td>";
        rows += "<td><b>" + formatHMS(item.split) + "</b></td>";
        rows += "<td>" + formatHMS(item.total) + "</td>";
        rows += "</tr>";
    }
    bodyElem.innerHTML = rows;
}

function swClearLaps() {
    swLaps = [];
    swLastLap = swRunning ? (swElapsed + (getNow() - swStartTime)) : 0;
    swRenderLaps();
}

document.onkeydown = function(e) {
    var k = e.keyCode || e.which;
    if (k === 32) { // Space
        swToggle();
        if (e.preventDefault) e.preventDefault();
        return false;
    }
    if (k === 76 || k === 108) { // L
        swRecordLap();
    }
    if (k === 82 || k === 114) { // R
        swReset();
    }
};

swUpdateDisplay();
</script>

</body>
</html>
